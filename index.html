
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigitalByDoing | Business Growth</title>
  <meta name="description" content="We Turn Business Goals Into Growth.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      text-align: center;
    }
    header { padding: 25px 15px; }
    .logo { font-size: 25px; font-weight: bold; }
    main { padding: 100px 20px; }
    h1 { font-size: clamp(36px, 7vw, 65px); }
    h1 span { color: #58a6ff; }
    p {
      color: #c2c9d6;
      font-size: 18px;
      line-height: 1.7;
    }
    .services {
      max-width: 750px;
      margin: 45px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      padding: 0 15px;
    }
    .service {
      background: #171f35;
      padding: 25px 15px;
      border-radius: 12px;
    }
    footer { padding: 30px; color: #aab3c5; }
  </style>
</head>
<body>
  <header>
    <div class="logo">DigitalByDoing.</div>
  </header>

  <main>
    <h1>We Turn Business Goals Into <span>Growth.</span></h1>
    <p>
      Smarter marketing. Better communication.
      More efficient business workflows.
    </p>

    <div class="services">
      <div class="service">WhatsApp Automation</div>
      <div class="service">Social Media Marketing</div>
      <div class="service">Meta Ads</div>
      <div class="service">Business Workflow Automation</div>
    </div>
  </main>

  <footer>
    © 2026 DigitalByDoing. All rights reserved.
  </footer>
</body>
</html>
